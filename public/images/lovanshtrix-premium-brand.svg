<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Lovanshtrix LX luxury tech emblem</title>
<desc id="desc">Sapphire blue and metallic gold intersecting LX emblem with Lovanshtrix brand signature. Vector adaptation of the selected blue and gold logo direction.</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041D58"/><stop offset=".34" stop-color="#0B64D1"/><stop offset=".55" stop-color="#34BAFF"/><stop offset=".76" stop-color="#07429B"/><stop offset="1" stop-color="#04163B"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8C531C"/><stop offset=".22" stop-color="#FFE4A1"/><stop offset=".48" stop-color="#C68A31"/><stop offset=".73" stop-color="#FFF1BE"/><stop offset="1" stop-color="#AF762B"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8F2FF"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#082C70" flood-opacity=".18"/></filter>
</defs>
<rect width="800" height="800" rx="72" fill="url(#paper)"/>
<circle cx="400" cy="325" r="265" fill="none" stroke="#D9B26B" stroke-width="1.8" stroke-dasharray="5 14" opacity=".48"/>
<g filter="url(#shadow)" stroke-linejoin="round">
 <path d="M196 126H292V436H453L505 518H196Z" fill="url(#blue)" stroke="url(#gold)" stroke-width="12"/>
 <path d="M318 175L390 140L578 442L513 527Z" fill="url(#gold)" stroke="#A76F24" stroke-width="5"/>
 <path d="M561 148H663L473 350L661 527H543L403 393L316 482L269 414Z" fill="url(#blue)" stroke="url(#gold)" stroke-width="11"/>
 <path d="M191 515L289 431L457 431L512 516Z" fill="url(#gold)" opacity=".72"/>
 <path d="M208 141H277V416" fill="none" stroke="#7BD8FF" stroke-width="5" opacity=".8"/>
 <path d="M590 169L471 298" stroke="#C2EDFF" stroke-width="5" opacity=".8"/>
</g>
<path d="M176 569H624" stroke="#E1B76D" stroke-width="2" opacity=".65"/>
<text x="400" y="656" font-family="Arial, Helvetica, sans-serif" font-size="69" font-weight="800" letter-spacing="3.5" text-anchor="middle" fill="#083675">LOVANSHTRIX</text>
<text x="400" y="705" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="9" text-anchor="middle" fill="#986B2E">IDEAS INTO INNOVATION</text>
